<!doctype html>
<html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>
<title>BloxVerse</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:#232527;color:#f2f4f5;font-family:'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden;height:100vh;height:100dvh}
.scr{position:fixed;inset:0;display:none;overflow:auto}.scr.on{display:block}
#auth.on{display:grid;place-items:center;padding:16px;background:linear-gradient(#335fff55,#232527)}
.box{background:#393b3d;border-radius:12px;padding:22px;width:100%;max-width:380px}
.logo{font-weight:900;font-size:30px;text-align:center;margin-bottom:14px}.logo i{font-style:normal;background:#00b06f;padding:0 8px;border-radius:6px}
.tabs{display:flex;margin-bottom:14px;border-bottom:2px solid #4a4d50}
.tabs button{flex:1;background:none;border:0;color:#a4a9ad;font:inherit;font-weight:700;padding:10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:#fff;border-color:#00b06f}
label{display:block;font-size:13px;color:#a4a9ad;margin:10px 0 4px}
input{width:100%;background:#232527;border:1px solid #4a4d50;border-radius:6px;color:#fff;padding:11px;font:inherit}
.btn{width:100%;margin-top:16px;background:#00b06f;color:#fff;border:0;border-radius:6px;padding:12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.err{color:#ff6b6b;font-size:14px;min-height:20px;margin-top:10px}
.note{color:#a4a9ad;font-size:12px;margin-top:10px;line-height:1.4}
#home{background:#232527}
.bar{display:flex;align-items:center;gap:10px;background:#191a1c;padding:10px 14px;position:sticky;top:0}
.bar b{flex:1}.pill{background:#393b3d;border-radius:6px;padding:6px 10px;font-weight:700}
.sm{background:#393b3d;color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px;max-width:900px;margin:0 auto}
.gc{background:none;border:0;color:#fff;text-align:left;font:inherit;cursor:pointer;padding:0}
.gc .t{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:56px}
.gc b{display:block;margin-top:6px}.gc small{color:#a4a9ad}
.gc.off{opacity:.45;cursor:default}
h2{padding:16px 16px 0;max-width:900px;margin:0 auto}
#game{background:#9fd8ff;overflow:hidden;touch-action:none}
#cv{width:100%;height:100%;display:block}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;pointer-events:none}
.hud *{pointer-events:auto}.hud span{flex:1;background:#000a;padding:6px 10px;border-radius:6px;pointer-events:none}
#js{position:absolute;left:18px;bottom:28px;width:130px;height:130px;border-radius:50%;background:#ffffff33;border:2px solid #fff8;touch-action:none}
#kn{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#fffc;pointer-events:none}
#jb{position:absolute;right:24px;bottom:44px;width:84px;height:84px;border-radius:50%;background:#00b06fcc;border:2px solid #fff;color:#fff;font:inherit;font-weight:800;touch-action:none}
#ts{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;display:none;text-align:center}
</style></head><body>
<div id='auth' class='scr on'><div class='box'>
<div class='logo'><i>Blox</i>Verse</div>
<div class='tabs'><button id='tl' class='on'>Log in</button><button id='ts2'>Sign up</button></div>
<label for='u'>Username</label><input id='u' autocomplete='username' maxlength='16'>
<label for='p'>Password</label><input id='p' type='password' autocomplete='current-password'>
<div id='p2w' style='display:none'><label for='p2'>Confirm password</label><input id='p2' type='password' autocomplete='new-password'></div>
<div class='err' id='er'></div>
<button class='btn' id='go'>Log in</button>
<p class='note'>Accounts are saved in this browser only. Please do not use a password from another site. BloxVerse is an independent fan project and is not affiliated with Roblox Corporation.</p>
</div></div>
<div id='home' class='scr'>
<div class='bar'><b id='hi'></b><span class='pill'>&#x1FA99; <span id='hc'>0</span></span><button class='sm' id='lo'>Log out</button></div>
<h2>Games</h2><div class='gr' id='gr'></div>
</div>
<div id='game' class='scr'>
<canvas id='cv'></canvas>
<div class='hud'><button class='sm' id='lv'>Leave</button><span id='hd'></span></div>
<div id='ts'></div>
<div id='js'><div id='kn'></div></div><button id='jb'>JUMP</button>
</div>
<script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
<script>
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const show=id=>{document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id))};
let user=null,coins=0,mode='in';
const users=()=>{try{return JSON.parse(localStorage.getItem('bvu')||'{}')}catch(e){return {}}};
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bv:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function tab(m){mode=m;$('#tl').classList.toggle('on',m==='in');$('#ts2').classList.toggle('on',m==='up');$('#p2w').style.display=m==='up'?'block':'none';$('#go').textContent=m==='in'?'Log in':'Sign up';$('#er').textContent=''}
$('#tl').onclick=()=>tab('in');$('#ts2').onclick=()=>tab('up');
$('#go').onclick=async()=>{
 const n=$('#u').value.trim(),p=$('#p').value,er=$('#er'),all=users(),k=n.toLowerCase();
 if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return er.textContent='Username must be 3 to 16 letters, numbers or underscores.';
 if(p.length<6)return er.textContent='Password must be at least 6 characters.';
 const h=await hash(k+':'+p);
 if(mode==='up'){if(p!==$('#p2').value)return er.textContent='Passwords do not match.';if(all[k])return er.textContent='That username is taken. Try another.';all[k]=h;try{localStorage.setItem('bvu',JSON.stringify(all))}catch(e){return er.textContent='This browser blocked saving. Turn off private mode.'}}
 else if(all[k]!==h)return er.textContent='Wrong username or password.';
 try{localStorage.setItem('bvs',n)}catch(e){}
 enter(n)};
function enter(n){user=n;try{coins=+localStorage.getItem('bvc_'+n.toLowerCase())||0}catch(e){coins=0}
 $('#hi').textContent='Welcome, '+n;setC(coins);$('#p').value=$('#p2').value='';show('home')}
function setC(n){coins=n;$('#hc').textContent=n;try{localStorage.setItem('bvc_'+user.toLowerCase(),n)}catch(e){}}
$('#lo').onclick=()=>{try{localStorage.removeItem('bvs')}catch(e){}user=null;show('auth')};
const GL=[['Obby World 3D','&#x1F9F1;','#d9573b',1],['Pet Paradise','&#x1F43E;','#e07aa8'],['Haunted Halls','&#x1F6AA;','#4a3b6b'],['Neighborhood Life','&#x1F3E1;','#3d8f5a'],['Mystery Murder','&#x1F52A;','#5c3b3b'],['Fruit Fighters','&#x1F34E;','#c0392b']];
$('#gr').innerHTML=GL.map((g,i)=>'<button class="gc'+(g[3]?'':' off')+'" data-i="'+i+'"><div class="t" style="background:'+g[2]+'">'+g[1]+'</div><b>'+g[0]+'</b><small>'+(g[3]?'Play now (3D)':'Coming soon')+'</small></button>').join('');
$('#gr').onclick=e=>{const b=e.target.closest('.gc');if(b&&GL[+b.dataset.i][3])startGame()};
try{const s=localStorage.getItem('bvs');if(s&&users()[s.toLowerCase()])enter(s)}catch(e){}

// ---------- 3D game ----------
let R,sc,cam,me,plats,cm,npcs,raf,clock,cp,vy,on,yaw,pitch,tw,fin,jh;
const mv={x:0,y:0},keys={};
function tag(t){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='#000a';x.fillRect(0,0,256,64);x.fillStyle='#fff';x.font='bold 32px sans-serif';x.textAlign='center';x.fillText(t,128,44);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.scale.set(6,1.5,1);s.position.y=7.4;return s}
function avatar(col,name){const g=new THREE.Group(),L=c=>new THREE.MeshLambertMaterial({color:c});
 const box=(w,h,d,x,y,z,c,pv)=>{const gm=new THREE.BoxGeometry(w,h,d);if(pv)gm.translate(0,-h/2,0);const b=new THREE.Mesh(gm,L(c));b.position.set(x,y,z);g.add(b);return b};
 box(2,2,1,0,3,0,col);box(1.3,1.3,1.3,0,4.65,0,0xffd23c);
 g.arm1=box(.9,2,.9,-1.45,4,0,0xffd23c,1);g.arm2=box(.9,2,.9,1.45,4,0,0xffd23c,1);
 g.leg1=box(.95,2,.95,-.5,2,0,0x2a8f4a,1);g.leg2=box(.95,2,.95,.5,2,0,0x2a8f4a,1);
 g.add(tag(name));return g}
function grid(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#4caf50';x.fillRect(0,0,64,64);x.strokeStyle='#3a8d3e';x.lineWidth=3;x.strokeRect(0,0,64,64);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(25,25);return t}
function addP(x,y,z,w,col,cpf){const m=new THREE.Mesh(new THREE.BoxGeometry(w,1,w),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y-.5,z);sc.add(m);const p={x,y:y-.5,z,w,h:1,d:w,cp:cpf};plats.push(p);return p}
function toast(t,ms){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(tw);tw=setTimeout(()=>e.style.display='none',ms||2200)}
function startGame(){
 show('game');
 try{R=new THREE.WebGLRenderer({canvas:$('#cv'),antialias:true})}catch(e){show('home');alert('3D is not supported on this device.');return}
 R.setPixelRatio(Math.min(devicePixelRatio,2));size();
 sc=new THREE.Scene();sc.background=new THREE.Color(0x9fd8ff);sc.fog=new THREE.Fog(0x9fd8ff,90,300);
 cam=new THREE.PerspectiveCamera(65,1,.1,400);size();
 sc.add(new THREE.HemisphereLight(0xffffff,0x778899,.95));const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(30,60,20);sc.add(sun);
 plats=[];cm=[];npcs=[];
 const bp=new THREE.Mesh(new THREE.BoxGeometry(100,1,100),new THREE.MeshLambertMaterial({map:grid()}));bp.position.y=-.5;sc.add(bp);plats.push({x:0,y:-.5,z:0,w:100,h:1,d:100});
 const cols=[0xe8453c,0xffc928,0x3a6ff0,0x2fb35a,0xa24cf0,0xff8a2b];
 for(let i=0;i<20;i++){const x=Math.sin(i*.9)*10,y=2+i*1.2,z=-58-i*8.5;addP(x,y,z,6,cols[i%6],i%5===0);
  if(i%2===1){const c=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.3,16),new THREE.MeshLambertMaterial({color:0xffc928,emissive:0x553d00}));c.rotation.x=Math.PI/2;c.position.set(x,y+2.5,z);sc.add(c);cm.push(c)}}
 const fx=Math.sin(18)*10,fy=2+20*1.2,fz=-58-20*8.5;addP(fx,fy,fz,9,0xffd700,true);
 const tr=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16),new THREE.MeshLambertMaterial({color:0xffd700,emissive:0x886600}));tr.position.set(fx,fy+2.5,fz);sc.add(tr);fin={x:fx,y:fy,z:fz,m:tr};
 const sign=new THREE.Mesh(new THREE.BoxGeometry(14,5,.6),new THREE.MeshLambertMaterial({color:0x335fff}));sign.position.set(0,2.5,-30);sc.add(sign);
 for(let i=0;i<3;i++){const n=avatar([0xe8453c,0xa24cf0,0xff8a2b][i],['Builder_'+(i+1),'xX_Noob_Xx','PetLover'][i]);n.position.set(Math.random()*60-30,0,Math.random()*40-10);n.tx=n.position.x;n.tz=n.position.z;n.t=Math.random()*9;sc.add(n);npcs.push(n)}
 me=avatar(0x335fff,user);me.position.set(0,0,20);sc.add(me);cp={x:0,y:0,z:20};vy=0;on=false;yaw=0;pitch=.35;jh=false;
 $('#hd').textContent='Reach the golden ball at the top of the tower. Coins: 0';
 clock=new THREE.Clock();cancelAnimationFrame(raf);tick();toast('Drag to look around. Walk to the blue sign and climb!',3500)}
function size(){if(!R)return;const w=innerWidth,h=innerHeight;R.setSize(w,h,false);if(cam){cam.aspect=w/h;cam.updateProjectionMatrix()}}
addEventListener('resize',size);
function ground(x,z,f){let b=null;for(const p of plats){const t=p.y+p.h/2;if(Math.abs(x-p.x)<p.w/2+.4&&Math.abs(z-p.z)<p.d/2+.4&&t<=f+.4&&(!b||t>b.top))b={p:p,top:t}}return b}
function tick(){
 raf=requestAnimationFrame(tick);const dt=Math.min(.05,clock.getDelta());
 let ix=mv.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=mv.y+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
 const dx=-Math.sin(yaw)*iy+Math.cos(yaw)*ix,dz=-Math.cos(yaw)*iy-Math.sin(yaw)*ix,P=me.position;
 P.x=clamp(P.x+dx*15*dt,-300,300);P.z=clamp(P.z+dz*15*dt,-300,300);
 if((keys[' ']||jh)&&on){vy=24;on=false}
 const py=P.y;vy-=60*dt;P.y+=vy*dt;const g=ground(P.x,P.z,py);on=false;
 if(g&&P.y<=g.top&&vy<=0){P.y=g.top;vy=0;on=true;if(g.p.cp)cp={x:g.p.x,y:g.top,z:g.p.z}}
 if(P.y<-40){P.set(cp.x,cp.y+1,cp.z);vy=0;toast('Respawned at your checkpoint')}
 if(l>.1){me.rotation.y=Math.atan2(dx,dz)}
 swing(me,l>.1,dt,'t');
 for(let i=cm.length-1;i>=0;i--){const c=cm[i];c.rotation.z+=dt*3;if(Math.hypot(c.position.x-P.x,c.position.y-P.y-3,c.position.z-P.z)<3.2){sc.remove(c);cm.splice(i,1);setC(coins+5);$('#hd').textContent='Reach the golden ball at the top of the tower. Coins: '+coins}}
 if(Math.hypot(fin.x-P.x,fin.z-P.z)<4&&Math.abs(fin.y-P.y)<4){setC(coins+50);toast('You made it! +50 coins',3500);$('#hd').textContent='You won! Coins: '+coins;P.set(0,1,20);cp={x:0,y:0,z:20};vy=0}
 fin.m.rotation.y+=dt*2;
 for(const n of npcs){n.t-=dt;const ddx=n.tx-n.position.x,ddz=n.tz-n.position.z,d=Math.hypot(ddx,ddz);if(d<1||n.t<0){n.tx=Math.random()*90-45;n.tz=Math.random()*60-40;n.t=6+Math.random()*6}else{n.position.x+=ddx/d*6*dt;n.position.z+=ddz/d*6*dt;n.rotation.y=Math.atan2(ddx,ddz)}swing(n,true,dt,'t')}
 const tx=P.x,ty=P.y+4,tz=P.z;cam.position.set(tx+Math.sin(yaw)*Math.cos(pitch)*20,ty+Math.sin(pitch)*20+2,tz+Math.cos(yaw)*Math.cos(pitch)*20);cam.lookAt(tx,ty,tz);
 R.render(sc,cam)}
function swing(a,mvg,dt,k){a[k+'s']=(a[k+'s']||0)+(mvg?dt*10:0);const s=mvg?Math.sin(a[k+'s'])*.8:0;a.leg1.rotation.x=s;a.leg2.rotation.x=-s;a.arm1.rotation.x=-s;a.arm2.rotation.x=s}
$('#lv').onclick=()=>{cancelAnimationFrame(raf);if(R){R.dispose();R=null}show('home')};
// controls
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const cv=$('#cv');let dr=null;
cv.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!dr)return;yaw-=(e.clientX-dr.x)*.006;pitch=clamp(pitch+(e.clientY-dr.y)*.005,-.2,1.2);dr.x=e.clientX;dr.y=e.clientY};
cv.onpointerup=cv.onpointercancel=()=>{dr=null};
const js=$('#js'),kn=$('#kn');let jid=null;
function jm(e){const r=js.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const l=Math.hypot(x,y),m=r.width/2*.7;if(l>m){x*=m/l;y*=m/l}mv.x=x/m;mv.y=-y/m;kn.style.transform='translate('+x+'px,'+y+'px)'}
js.onpointerdown=e=>{jid=e.pointerId;js.setPointerCapture(jid);jm(e)};
js.onpointermove=e=>{if(e.pointerId===jid)jm(e)};
js.onpointerup=js.onpointercancel=()=>{jid=null;mv.x=mv.y=0;kn.style.transform=''};
const jb=$('#jb');jb.onpointerdown=()=>{jh=true};jb.onpointerup=jb.onpointercancel=jb.onpointerleave=()=>{jh=false};
</script></body></html>
